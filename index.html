<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#0d1b2a;--mut:#5b6b7c;--bd:#dbe2ea;--head:#0d1b2a;--c:#1f5fbf;--live:#e0342b}
@media(prefers-color-scheme:dark){:root{--bg:#0a1119;--card:#131e2a;--tx:#eaf0f6;--mut:#8fa1b3;--bd:#22303f;--head:#050a10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,sans-serif}
header{background:var(--head);color:#fff;padding:28px 16px 0}
.wrap{max-width:860px;margin:0 auto}
h1{font:700 clamp(30px,7vw,52px)/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px;letter-spacing:.5px}
header p{margin:0;color:#a9b8c8}
.brand{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.logo{width:clamp(84px,22vw,140px);height:auto;flex:none}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:1 0 auto;white-space:nowrap;border:0;background:#1b2a3a;color:#c5d1de;font:600 17px "Barlow Condensed",sans-serif;padding:12px 14px;cursor:pointer;border-radius:8px 8px 0 0;border-bottom:5px solid transparent}
nav button[aria-selected=true]{background:var(--bg);color:var(--tx);border-bottom-color:var(--c)}
nav button:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
main{padding:16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.sync{font-size:14px;color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2fa866;margin-right:6px}
.dot.off{background:#c9a227}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:22px 0 8px;color:var(--c)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.m .t{font-weight:600}.m .t.b{text-align:right}
.sc{font:700 30px "Barlow Condensed",sans-serif;min-width:88px;text-align:center;letter-spacing:1px}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mut);border-top:1px dashed var(--bd);padding-top:6px}
.st{font-weight:600}
.st.live{color:var(--live)}.st.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.st.live::before{animation:none}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:8px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:14px;color:var(--mut);font-weight:600}
td.n{width:52px;font:700 20px "Barlow Condensed",sans-serif}
.g{color:#b98a00}.s{color:#7d8791}.z{color:#a5602a}
.tw{overflow-x:auto}
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cc{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--c);border-radius:8px;padding:12px 14px}
.cc h3{font:700 20px "Barlow Condensed",sans-serif;margin:0 0 6px}
.cr{display:flex;gap:10px;align-items:center;padding:4px 0}
.md{font:700 15px "Barlow Condensed",sans-serif;min-width:70px;text-transform:uppercase;letter-spacing:.5px}
.win{background:var(--head);color:#fff;border-left:6px solid #e2b200;border-radius:8px;padding:14px 16px;margin-bottom:6px}
.win span{color:#a9b8c8;font-size:14px}.win b{font:700 32px/1.1 "Barlow Condensed",sans-serif;display:block}
.note{font-size:14px;color:var(--mut);margin:6px 0 0}
.empty{padding:28px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--bd);border-radius:8px}
.demo{background:#fff3cd;color:#5c4400;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
footer{padding:20px 16px 32px;text-align:center;color:var(--mut);font-size:14px}
footer a{color:var(--mut)}
</style>
</head>

 {"nama sekolah":"SDN 2 Gajahmungkur",alamat:"Jl. Contoh No. 2",cabang:"Futsal, Atletik"},
 {"nama sekolah":"SDN 10 Gajahmungkur",alamat:"Jl. Contoh No. 10",cabang:"Tonnis"}],
Atlet:[
 {nama:"Raka Pratama",sekolah:"SDN 2",cabang:"Atletik",nomor:"Lari 100 m",kategori:"Putra"},
 {nama:"Sinta Larasati",sekolah:"SDN 1",cabang:"Atletik",nomor:"Lompat Jauh",kategori:"Putri"},
 {nama:"Dimas Aji",sekolah:"SDN 5",cabang:"Tonnis",nomor:"Tunggal",kategori:"Putra"},
 {nama:"Nadia Putri",sekolah:"SDN 3",cabang:"Tonnis",nomor:"Tunggal",kategori:"Putri"}]
};

/* ===== KODE ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cur=SPORTS[0].key, store={}, online=true, updated=null;

function parseCSV(t){
  const r=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){row.push(f);f=""}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);r.push(row)}
  return r;
}
function toObjs(t){
  const r=parseCSV(t).filter(x=>x.some(v=>v.trim()));
  if(!r.length)return [];
  const h=r.shift().map(s=>s.trim().toLowerCase());
  return r.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])));
}
async function load(){
  if(!SHEET_ID){store=DEMO;updated=new Date();$("demo").hidden=false;render();return}
  try{
    const res=await Promise.all(DATA_TABS.map(async k=>{
      try{
        const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(k)}`;
        const r=await fetch(u,{cache:"no-store"});
        if(!r.ok)throw new Error(r.status);
        let o=toObjs(await r.text());
        if(k==="Sekolah")o=o.filter(x=>x["nama sekolah"]);
        if(k==="Atlet")o=o.filter(x=>x.nama&&x.cabang);
        return [k,o];
      }catch(e){if(["Juara","Sekolah","Atlet"].includes(k))return [k,[]];throw e}
    }));
    store=Object.fromEntries(res);online=true;updated=new Date();
  }catch(e){online=false}
  render();
}
function statusHTML(s){
  const v=(s||"").toLowerCase();
  const cls=v.startsWith("berlangsung")||v==="live"?"live":"";
  return `<span class="st ${cls}">${esc(s||"Terjadwal")}</span>`;
}
function matches(rows,q){
  const g={};
  rows.forEach(r=>{(g[r.tanggal||"Tanpa tanggal"]??=[]).push(r)});
  return Object.keys(g).sort().map(d=>{
    const dt=/^\d{4}-\d{2}-\d{2}$/.test(d)?new Date(d+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):d;
    return `<h2>${esc(dt)}</h2>`+g[d].sort((a,b)=>(a.jam||"").localeCompare(b.jam||"")).map(r=>{
      const has=r["skor a"]!==""||r["skor b"]!=="";
      return `<div class="m"><div class="t">${esc(r["tim a"])}</div><div class="sc">${has?esc(r["skor a"]||0)+" - "+esc(r["skor b"]||0):"vs"}</div><div class="t b">${esc(r["tim b"])}</div>
      <div class="meta"><span>${esc([r.jam,r.kategori,r.babak].filter(Boolean).join(", "))}${r.lokasi?" • "+esc(r.lokasi):""}</span>${statusHTML(r.status)}</div></div>`}).join("");
  }).join("");
}
function medals(rows){
  const m={};
  rows.forEach(r=>{const p=+r.peringkat;if(p>=1&&p<=3&&r.sekolah){const o=m[r.sekolah]??={g:0,s:0,z:0};o[["g","s","z"][p-1]]++}});
  const l=Object.entries(m).sort((a,b)=>b[1].g-a[1].g||b[1].s-a[1].s||b[1].z-a[1].z);
  if(!l.length)return "";
  return `<h2>Perolehan medali</h2><div class="tw"><table><tr><th>Sekolah</th><th class="g">Emas</th><th class="s">Perak</th><th class="z">Perunggu</th></tr>`+
    l.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.g}</td><td>${v.s}</td><td>${v.z}</td></tr>`).join("")+`</table></div>`;
}
function track(rows,all){
  const g={};
  rows.forEach(r=>{(g[(r.nomor||"Nomor lomba")+" "+(r.kategori||"")]??=[]).push(r)});
  return medals(all)+Object.keys(g).map(k=>`<h2>${esc(k.trim())}</h2><div class="tw"><table><tr><th>#</th><th>Nama</th><th>Sekolah</th><th>Hasil</th></tr>`+
    g[k].sort((a,b)=>(+a.peringkat||99)-(+b.peringkat||99)).map(r=>`<tr><td class="n">${esc(r.peringkat)}</td><td>${esc(r.nama)}</td><td>${esc(r.sekolah)}</td><td>${esc(r.hasil)}</td></tr>`).join("")+`</table></div>`).join("");
}
function schools(rows){
  const hasA=rows.some(r=>r.alamat);
  return `<h2>${rows.length} sekolah peserta</h2><div class="tw"><table><tr><th>#</th><th>Nama sekolah</th>${hasA?"<th>Alamat</th>":""}<th>Cabang</th></tr>`+
    rows.slice().sort((a,b)=>a["nama sekolah"].localeCompare(b["nama sekolah"],"id",{numeric:true})).map((r,i)=>`<tr><td class="n">${i+1}</td><td>${esc(r["nama sekolah"])}</td>${hasA?`<td>${esc(r.alamat)}</td>`:""}<td>${esc(r.cabang)}</td></tr>`).join("")+`</table></div>`;
}
function athletes(rows){
  const g={};
  rows.forEach(r=>{(g[r.cabang]??=[]).push(r)});
  return Object.keys(g).sort().map(k=>`<h2>${esc(k)} (${g[k].length} atlet)</h2><div class="tw"><table><tr><th>#</th><th>Nama</th><th>Sekolah</th><th>Nomor</th><th>Kategori</th></tr>`+
    g[k].sort((a,b)=>a.nama.localeCompare(b.nama,"id")).map((r,i)=>`<tr><td class="n">${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.sekolah)}</td><td>${esc(r.nomor)}</td><td>${esc(r.kategori)}</td></tr>`).join("")+`</table></div>`).join("");
}
const jr=()=>(store.Juara||[]).filter(r=>r.cabang&&r.sekolah&&/[1-3]/.test(r.juara)).map(r=>({...r,p:+String(r.juara).match(/[1-3]/)[0]}));
function champs(cabang,q){
  let l=jr().filter(r=>r.cabang.toLowerCase()===cabang.toLowerCase());
  if(q)l=l.filter(r=>[r.kategori,r.sekolah].join(" ").toLowerCase().includes(q));
  if(!l.length)return "";
  const g={};l.forEach(r=>{(g[r.kategori||"Umum"]??=[]).push(r)});
  return `<h2>Hasil juara</h2><div class="ch">`+Object.keys(g).sort().map(k=>`<div class="cc"><h3>${esc(k)}</h3>`+
    g[k].sort((a,b)=>a.p-b.p).map(r=>`<div class="cr"><span class="md ${["g","s","z"][r.p-1]}">Juara ${r.p}</span><b>${esc(r.sekolah)}</b></div>`).join("")+`</div>`).join("")+`</div>`;
}
function juaraList(q){
  const sec=[];
  const cards=g=>`<div class="ch">`+Object.keys(g).sort().map(k=>`<div class="cc"><h3>${esc(k)}</h3>`+
    g[k].sort((a,b)=>a.p-b.p).map(r=>`<div class="cr"><span class="md ${["g","s","z"][r.p-1]}">Juara ${r.p}</span><b>${esc(r.nama?r.nama+" ("+r.sekolah+")":r.sekolah)}</b>${r.hasil?` <span>${esc(r.hasil)}</span>`:""}</div>`).join("")+`</div>`).join("")+`</div>`;
  const ok=r=>!q||Object.values(r).join(" ").toLowerCase().includes(q);
  ["Tonnis","Futsal","Atletik"].forEach(c=>{
    const g={};
    if(c==="Atletik")(store.Atletik||[]).forEach(r=>{const p=+r.peringkat;if(p>=1&&p<=3&&r.sekolah&&ok(r))(g[((r.nomor||"")+" "+(r.kategori||"")).trim()||"Atletik"]??=[]).push({...r,p})});
    else jr().filter(r=>r.cabang.toLowerCase()===c.toLowerCase()&&ok(r)).forEach(r=>{(g[r.kategori||"Umum"]??=[]).push(r)});
    if(Object.keys(g).length)sec.push(`<h2>${c}</h2>`+cards(g));
  });
  return sec.join("");
}
function overall(q){
  const m={};
  const add=(s,i)=>{if(s)(m[s]??={g:0,s:0,z:0})[["g","s","z"][i]]++};
  (store.Atletik||[]).forEach(r=>{const p=+r.peringkat;if(p>=1&&p<=3)add(r.sekolah,p-1)});
  jr().filter(r=>r.cabang.toLowerCase()!=="atletik").forEach(r=>add(r.sekolah,r.p-1));
  const l=Object.entries(m).sort((a,b)=>b[1].g-a[1].g||b[1].s-a[1].s||b[1].z-a[1].z);
  if(!l.length)return "";
  const v=l.map(([k,o],i)=>({k,o,i:i+1})).filter(x=>!q||x.k.toLowerCase().includes(q));
  return `<div class="win"><span>Juara Umum saat ini</span><b>${esc(l[0][0])}</b></div>
  <h2>Klasemen juara umum</h2><div class="tw"><table><tr><th>#</th><th>Sekolah</th><th class="g">Emas</th><th class="s">Perak</th><th class="z">Perunggu</th><th>Total</th></tr>`+
  v.map(x=>`<tr><td class="n">${x.i}</td><td>${esc(x.k)}</td><td>${x.o.g}</td><td>${x.o.s}</td><td>${x.o.z}</td><td>${x.o.g+x.o.s+x.o.z}</td></tr>`).join("")+
  `</table></div><p class="note">Urutan: emas terbanyak, lalu perak, lalu perunggu. Medali dihitung dari Tonnis, Futsal, dan Atletik.</p>`;
}
function render(){
  $("tabs").innerHTML=SPORTS.map(s=>`<button role="tab" aria-selected="${s.key===cur}" data-k="${esc(s.key)}">${esc(s.key)}</button>`).join("");
  const sp=SPORTS.find(s=>s.key===cur);
  document.documentElement.style.setProperty("--c",sp.color);
  const q=$("q").value.trim().toLowerCase();
  const all=store[cur]||[];
  const rows=q?all.filter(r=>Object.values(r).join(" ").toLowerCase().includes(q)):all;
  $("out").innerHTML=sp.type==="overall"?(overall(q)||`<div class="empty">Belum ada juara yang tercatat. Cek lagi sebentar.</div>`)
    :sp.type==="juara"?(juaraList(q)||`<div class="empty">Belum ada juara yang tercatat. Cek lagi sebentar.</div>`)
    :!all.length?`<div class="empty">Belum ada data untuk ${esc(cur)}. Cek lagi sebentar.</div>`
    :!rows.length?`<div class="empty">Tidak ada hasil untuk "${esc(q)}".</div>`
    :sp.type==="match"?champs(cur,q)+matches(rows):sp.type==="sekolah"?schools(rows):sp.type==="atlet"?athletes(rows):track(rows,all);
  $("sync").innerHTML=`<span class="dot ${online?"":"off"}"></span>`+(online
    ?`Diperbarui ${updated.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`
    :"Tidak bisa memuat data terbaru, mencoba lagi otomatis");
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=b.dataset.k;render()}});
$("q").addEventListener("input",render);
$("adm").href=ADMIN_URL;
load();setInterval(load,REFRESH_MS);
</script>
